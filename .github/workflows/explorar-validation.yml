name: Validate Explore Prototype
on:
  push:
    branches:
      - feature/ranch-interactive-exploration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build Hydrogen without deploying
        run: npm run build
