name: The Ranch Explore - Oxygen Preview
on:
  push:
    branches:
      - feature/ranch-interactive-exploration

permissions:
  contents: read
  deployments: write

jobs:
  preview:
    if: github.ref == 'refs/heads/feature/ranch-interactive-exploration'
    name: Deploy exploration to Oxygen Preview ONLY
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Deploy to Oxygen PREVIEW (never production)
        run: npx shopify hydrogen deploy --preview
        env:
          SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN: ${{ secrets.OXYGEN_DEPLOYMENT_TOKEN_1000068751 }}
      - name: Print public preview origin without authentication parameters
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'h2_deploy_log.json';
          if (!fs.existsSync(path)) {console.log('Oxygen deployment record not found');process.exit(0);}
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          const urls = new Set();
          function walk(value) {
            if (typeof value === 'string') {
              for (const match of value.matchAll(/https:\/\/[^\s"'<>]+/g)) {
                try {
                  const url = new URL(match[0].replace(/[),;]+$/, ''));
                  if (url.hostname.endsWith('.myshopify.dev') || url.hostname.endsWith('.oxygen.shopify.dev')) {
                    urls.add(url.origin + '/explorar');
                  }
                } catch {}
              }
            } else if (Array.isArray(value)) value.forEach(walk);
            else if (value && typeof value === 'object') Object.values(value).forEach(walk);
          }
          walk(data);
          for (const url of urls) console.log('OXYGEN_PREVIEW_URL=' + url);
          if (!urls.size) console.log('No public preview origin found in deployment metadata');
          NODE
