<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>The Ranch | Exploración (prototipo)</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#34342f;background:#f8f8f5}*{box-sizing:border-box}body{margin:0}header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#fafaf7;border-bottom:1px solid #e6e6e0;position:relative;z-index:3}header strong{font-size:14px;letter-spacing:4px}header button{background:none;border:0;font-size:21px;cursor:pointer}.brand{text-align:center}.brand small{display:block;font-size:17px;line-height:12px}.map{height:calc(100dvh - 68px);min-height:520px;position:relative;overflow:hidden;touch-action:none;background-color:#fafaf7;background-image:repeating-radial-gradient(ellipse at 12% 30%,transparent 0 28px,#d9d9d3 29px,transparent 30px,transparent 54px),repeating-radial-gradient(ellipse at 85% 82%,transparent 0 36px,#e2e2dc 37px,transparent 38px,transparent 68px)}.map:before{content:"";position:absolute;inset:0;background:#fafaf7;opacity:.53;pointer-events:none}svg.routes{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}path{fill:none;stroke:#c9c8c1;stroke-width:.48;stroke-dasharray:1.4 1.7}.heading{position:absolute;top:4%;width:100%;text-align:center;letter-spacing:2.6px;font-size:11px;pointer-events:none}.heading span{display:block;font-family:Georgia,serif;letter-spacing:.5px;font-size:22px;margin-top:8px}.destination{position:absolute;transform:translate(-50%,-50%);border:1px solid #b9b7ae;border-radius:50%;width:79px;height:79px;background:rgba(250,250,247,.91);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#373730;cursor:pointer;z-index:2;box-shadow:0 3px 14px #2221}.destination span{font-size:20px}.destination b{font-size:9px;letter-spacing:1px}.destination:focus-visible{outline:3px solid #9d8b6b}.rider{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%) rotate(0deg);z-index:2;width:72px;height:108px;touch-action:none;cursor:grab;user-select:none;filter:drop-shadow(8px 12px 6px #0002)}.rider:active{cursor:grabbing}.horse{position:absolute;left:13px;top:5px;width:46px;height:94px;border-radius:48% 48% 42% 42%;background:linear-gradient(90deg,#75472e,#a46d45 45%,#73472e);border:2px solid #593b2c}.horse:before{content:"";position:absolute;top:-14px;left:12px;width:18px;height:26px;border-radius:40%;background:#855638}.horse:after{content:"";position:absolute;bottom:-19px;left:17px;width:8px;height:24px;background:#4b352b;border-radius:60%}.saddle{position:absolute;left:17px;top:38px;width:38px;height:34px;border-radius:50%;background:#2d2c2a;box-shadow:inset 0 0 0 6px #4e4c42}.hat{position:absolute;left:21px;top:41px;width:30px;height:24px;border-radius:50%;background:#c4b396;border:4px solid #927b58}.hoof{position:absolute;width:8px;height:11px;border-radius:50% 50% 40% 40%;background:#aaa69b;opacity:.48;pointer-events:none}.hint{position:absolute;bottom:27px;left:50%;transform:translateX(-50%);background:#fafaf7e8;border:1px solid #deddd5;padding:12px 15px;border-radius:25px;font-size:11px;letter-spacing:.4px;white-space:nowrap}.menu{display:none;position:absolute;z-index:5;top:68px;left:0;right:0;background:#fafaf7;padding:22px;box-shadow:0 10px 25px #0002}.menu.open{display:block}.menu button{display:block;border:0;background:none;padding:13px;width:100%;text-align:left;font-size:15px;border-bottom:1px solid #e7e5dd}.notice{position:absolute;top:19%;left:50%;transform:translateX(-50%);font-size:12px;background:#fff;padding:10px 15px;display:none;z-index:3;text-align:center;min-width:230px}@media(min-width:800px){.map{max-width:680px;margin:auto;border-left:1px solid #e5e5df;border-right:1px solid #e5e5df}}
</style></head><body><header><button id="menuButton" aria-label="Abrir menú">☰</button><div class="brand"><small>♉</small><strong>THE RANCH</strong></div><button aria-label="Carrito" title="Carrito">♧</button></header><nav class="menu" id="menu" aria-label="Colecciones"></nav><main class="map" id="map" aria-label="Mapa interactivo de colecciones"><div class="heading">ELIGE TU CAMINO<span>Explora The Ranch</span></div><svg class="routes" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M50 56 Q50 34 76 28 M50 56 Q45 40 22 35 M50 56 Q36 65 24 77 M50 56 Q67 60 79 70 M50 56 Q57 43 74 47"/></svg><div class="rider" id="rider" role="img" aria-label="Jinete a caballo; arrastra para explorar"><div class="horse"></div><div class="saddle"></div><div class="hat"></div></div><div class="notice" id="notice" role="status"></div><div class="hint">Arrastra el caballo o toca una colección</div></main>
<script>
const destinations=[{name:'GORRAS',icon:'♧',x:76,y:28,slug:'gorras'},{name:'CHAQUETAS',icon:'♧',x:22,y:35,slug:'chaquetas'},{name:'BOTAS',icon:'♧',x:24,y:77,slug:'botas'},{name:'CAMISAS',icon:'♧',x:74,y:47,slug:'camisas'},{name:'NIÑOS',icon:'♧',x:79,y:70,slug:'ninos'}];
const map=document.querySelector('#map'),rider=document.querySelector('#rider'),menu=document.querySelector('#menu'),notice=document.querySelector('#notice');let pos={x:50,y:56},drag=false,frame=null,lastTrail=0,trail=[];const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function render(){rider.style.left=pos.x+'%';rider.style.top=pos.y+'%'}function footprints(){if(reduced||performance.now()-lastTrail<140)return;lastTrail=performance.now();const dot=document.createElement('i');dot.className='hoof';dot.style.left='calc('+pos.x+'% - 4px)';dot.style.top='calc('+pos.y+'% + 28px)';map.append(dot);trail.push(dot);if(trail.length>36)trail.shift().remove()}
function move(x,y){const dx=x-pos.x,dy=y-pos.y;if(Math.hypot(dx,dy)>0.2){rider.style.rotate=(Math.atan2(dx,-dy)*180/Math.PI)+'deg';pos={x:clamp(x,6,94),y:clamp(y,16,91)};render();footprints()}}
function stop(){if(frame)cancelAnimationFrame(frame);frame=null}function arrive(d){notice.textContent='Llegaste a '+d.name+' · Ver colección';notice.style.display='block';notice.style.cursor='pointer';notice.onclick=()=>{location.href='/collections/'+d.slug};setTimeout(()=>notice.style.display='none',3200)}
function go(d){stop();notice.style.display='none';const start={...pos},t0=performance.now(),distance=Math.hypot(d.x-start.x,d.y-start.y),duration=reduced?0:clamp(distance*30,350,1150);function tick(now){const t=duration?Math.min(1,(now-t0)/duration):1;const eased=t*t*(3-2*t);move(start.x+(d.x-start.x)*eased,start.y+(d.y-start.y)*eased);if(t<1)frame=requestAnimationFrame(tick);else{frame=null;arrive(d)}}frame=requestAnimationFrame(tick)}
for(const d of destinations){const b=document.createElement('button');b.className='destination';b.style.left=d.x+'%';b.style.top=d.y+'%';b.innerHTML='<span aria-hidden="true">'+d.icon+'</span><b>'+d.name+'</b>';b.onclick=()=>go(d);map.append(b);const m=document.createElement('button');m.textContent=d.name+' →';m.onclick=()=>{menu.classList.remove('open');go(d)};menu.append(m)}
document.querySelector('#menuButton').onclick=()=>menu.classList.toggle('open');rider.addEventListener('pointerdown',e=>{stop();drag=true;rider.setPointerCapture(e.pointerId);notice.style.display='none'});rider.addEventListener('pointermove',e=>{if(!drag)return;const r=map.getBoundingClientRect();move((e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100)});function end(){drag=false}rider.addEventListener('pointerup',end);rider.addEventListener('pointercancel',end);render();
</script></body></html>
